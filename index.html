<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>E-com PFC | Доступ к системам</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --text: #f8fafc;
      --primary: #38bdf8;
      --danger: #ef4444;
    }
    body { 
      background: var(--bg); 
      color: var(--text); 
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; 
      display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; 
    }
    .container { text-align: center; padding: 20px; }
    h1 { margin-bottom: 10px; font-size: 28px; }
    .subtitle { margin-bottom: 30px; color: #94a3b8; }
    .password-box { margin-bottom: 30px; }
    input[type="password"] { 
      padding: 18px 20px; font-size: 18px; border: 2px solid #475569; 
      border-radius: 10px; background: #334155; color: #f8fafc; width: 280px;
      text-align: center; letter-spacing: 2px;
    }
    input:focus { outline: none; border-color: var(--primary); }
    .apps-grid { 
      display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); 
      gap: 18px; width: 95%; max-width: 1100px; 
    }
    .app-btn { 
      padding: 22px; background: var(--card); border: 1px solid #475569; 
      border-radius: 14px; color: var(--text); font-size: 15px; font-weight: 600; 
      cursor: pointer; transition: all 0.2s; text-decoration: none; display: block;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
    }
    .app-btn:hover { 
      background: #334155; transform: translateY(-4px); 
      box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2); border-color: var(--primary);
    }
    .app-btn i { display: block; font-size: 36px; margin-bottom: 12px; }
    .error-msg { color: var(--danger); margin-top: 10px; display: none; font-size: 14px; }
  </style>
</head>
<body>
  <div class="container">
    <h1>🚀 E-com PFC</h1>
    <div class="subtitle">Единое десктопное приложение</div>
    
    <div class="password-box">
      <input type="password" id="appPassword" placeholder="Введите пин-код" autofocus>
      <div class="error-msg" id="errorMsg">Неверный пин-код</div>
    </div>
    
    <div class="apps-grid" id="appsContainer" style="display: none;">
      <a href="#" class="app-btn" onclick="openApp('https://script.google.com/macros/s/AKfycbwZnapV8kWAeTp-LnYgJdNOHO2F5SiwQwJg47seelKQKn9_pI99C1NX2qiT4DsffXTM/exec')">
        <i>📦</i> Отдел контроля
      </a>
      <a href="#" class="app-btn" onclick="openApp('https://script.google.com/macros/s/AKfycbycb3AqIH4xadHvM8Rw4NjwxDQsVoVgOh6UBjAytEbT8iQg4S3oza-OQkfMdynXBcwW/exec')">
        <i>👥</i> Отдел HR
      </a>
      <a href="#" class="app-btn" onclick="openApp('https://script.google.com/macros/s/AKfycbyFhoj1pCCRbW-CYIIZLxQ5m-dHT1CATZm8xiDr25TG2Jkg4M5gvoolvD6v3Bmw0N-sCA/exec')">
        <i>📊</i> Учет статусов
      </a>
      <a href="#" class="app-btn" onclick="openApp('https://script.google.com/macros/s/AKfycbwkEwSr53WMbH9n0x2TbHNzJTAommCX-DW5nKqLn5OpyPeZjJ8IuumCcT89pxS_9opZ/exec')">
        <i>🏢</i> Админам складов
      </a>
      <a href="#" class="app-btn" onclick="openApp('https://script.google.com/macros/s/AKfycbz3zfSgWkzXP5T5YUq-tPW1kbXs1ImUPS6l7lIzu_3c5-YZXEbmP06O4_nR0wKPrWfwTg/exec')">
        <i>📈</i> Склад МП
      </a>
    </div>
  </div>

  <script>
    const CORRECT_PIN = '3333';
    const input = document.getElementById('appPassword');
    const container = document.getElementById('appsContainer');
    const errorMsg = document.getElementById('errorMsg');

    input.addEventListener('keydown', function(e) {
      if (e.key === 'Enter') {
        if (input.value === CORRECT_PIN) {
          container.style.display = 'grid';
          input.style.display = 'none';
          errorMsg.style.display = 'none';
        } else {
          errorMsg.style.display = 'block';
          input.style.borderColor = var(--danger);
          input.value = '';
          setTimeout(() => input.style.borderColor = '#475569', 1500);
        }
      }
    });

    function openApp(url) {
      nw.Window.open(url, {
        position: 'center',
        width: 1300,
        height: 850,
        frame: true, 
        title: 'E-com PFC'
      });
    }
  </script>
</body>
</html>
